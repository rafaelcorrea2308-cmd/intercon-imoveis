name: Build properties.json

on:
  push:
    branches:
      - main
    paths:
      - 'content/imoveis/**'
  workflow_dispatch: {}

concurrency:
  group: build-properties
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build properties.json
        run: node scripts/build-properties.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json
          if git diff --cached --quiet; then
            echo "Nada mudou em properties.json"
            exit 0
          fi
          git commit -m "Auto-build properties.json from content/imoveis"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push falhou, tentando de novo ($i)..."
            sleep 3
          done
