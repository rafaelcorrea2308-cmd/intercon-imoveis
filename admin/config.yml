backend:
  name: github
  repo: rafaelcorrea2308-cmd/intercon-imoveis
  branch: main
  base_url: https://intercon-oauth.rafaelcorrea2308.workers.dev
  auth_endpoint: auth
  locale: 'pt'

media_folder: "assets/anuncios"
public_folder: "assets/anuncios"

collections:
  - name: "imoveis"
    label: "Imóveis"
    label_singular: "Imóvel"
    folder: "content/imoveis"
    create: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    identifier_field: "titulo"
    summary: "#{{id}} [{{disponivel | ternary('✓','✕')}}] — {{titulo}} — {{bairro}} ({{finalidade}})"
    sortable_fields: ["id", "titulo", "bairro", "preco"]
    view_filters:
      - label: "Aluguel"
        field: finalidade
        pattern: "Aluguel"
      - label: "Venda"
        field: finalidade
        pattern: "Venda"
      - label: "Temporada"
        field: finalidade
        pattern: "Temporada"
      - label: "Disponível"
        field: disponivel
        pattern: "true"
      - label: "Indisponível"
        field: disponivel
        pattern: "false"
    view_groups:
      - label: "Bairro"
        field: bairro
    fields:
      - { label: "ID (número único, definido na criação — não pode ser alterado depois)", name: "id", widget: "lockedid" }
      - { label: "Disponível (desmarque quando alugar/vender)", name: "disponivel", widget: "boolean", default: true }
      - { label: "Título do anúncio", name: "titulo", widget: "string" }
      - { label: "Bairro", name: "bairro", widget: "string" }
      - { label: "Cidade", name: "cidade", widget: "string", default: "Campo Grande - MS" }
      - label: "Finalidade"
        name: "finalidade"
        widget: "select"
        options: ["Aluguel", "Venda", "Temporada"]
        default: "Aluguel"
      - label: "Tipo de imóvel"
        name: "tipo"
        widget: "select"
        options: ["Casa", "Apartamento", "Terreno", "Sala Comercial", "Chácara"]
        default: "Casa"
      - { label: "Preço (R$)", name: "preco", widget: "number", value_type: "int" }
              - { label: "Unidade de preço (somente para Temporada)", name: "unidade_temporada", widget: "select", options: ["dia", "semana", "mês", "hóspede"], default: "dia", required: false, hint: "Usado apenas quando a finalidade for Temporada. Aluguel é sempre por mês e Venda é valor total." }
      - { label: "Quartos", name: "quartos", widget: "number", value_type: "int" }
      - { label: "Banheiros", name: "banheiros", widget: "number", value_type: "int" }
      - { label: "Vagas de garagem", name: "vagas", widget: "number", value_type: "int" }
      - { label: "Área (m²)", name: "area", widget: "number", value_type: "int" }
      - { label: "Descrição", name: "descricao", widget: "text" }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        hint: "Arraste as fotos para esta área ou clique para escolher do computador. É necessário ter pelo menos 1 foto ou vídeo no total (some com o campo Vídeos abaixo)."
        field: { label: "Foto", name: "src", widget: "image" }
        summary: "{{fields.src}}"
      - label: "Vídeos"
        name: "videos"
        widget: "list"
        required: false
        hint: "Arquivos de vídeo (formato .mp4). Opcional."
        field: { label: "Vídeo", name: "src", widget: "file" }
        summary: "{{fields.src}}"
      - { label: "Endereço completo (rua, número, bairro, cidade)", name: "endereco", widget: "string", required: false, hint: "Digite o endereço completo. O mapa é gerado automaticamente." }
      - { label: "WhatsApp (com DDI 55 + DDD, só números)", name: "whatsapp", widget: "string" }
