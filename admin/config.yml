backend:
  name: github
  repo: rafaelcorrea2308-cmd/intercon-imoveis
  branch: main
  base_url: https://intercon-oauth.rafaelcorrea2308.workers.dev
  auth_endpoint: auth

locale: 'pt'
show_preview_links: false
media_folder: "assets/anuncios"
public_folder: "assets/anuncios"

collections:
  - name: "imoveis"
    label: "Publicações"
    label_singular: "Nova"
    folder: "content/imoveis"
    create: true
    extension: "json"
    format: "json"
    slug: "{{id}}"
    identifier_field: "titulo"
    media_folder: "/assets/anuncios/{{fields.id}}"
    public_folder: "assets/anuncios/{{fields.id}}"
    summary: "#{{id}} [{{disponivel | ternary('✓','✕')}}] — ({{finalidade}}) — {{uf}} — {{cidade}} — {{bairro}} — {{titulo}}"
    sortable_fields: ["id", "titulo", "bairro", "preco"]
    view_filters:
      - label: "Aluguel"
        field: finalidade
        pattern: "Aluguel"
      - label: "Venda"
        field: finalidade
        pattern: "Venda"
      - label: "Temporada"
        field: finalidade
        pattern: "Temporada"
      - label: "Obras e serviços"
        field: finalidade
        pattern: "Obras e serviços"
      - label: "Disponível"
        field: disponivel
        pattern: "true"
      - label: "Indisponível"
        field: disponivel
        pattern: "false"
    view_groups:
      - label: "Bairro"
        field: bairro
    fields:
      - { label: "ID (número único, definido na criação — não pode ser alterado depois)", name: "id", widget: "lockedid" }
      - { label: "Disponível", name: "disponivel", widget: "boolean", default: true, hint: "Desmarque quando o imóvel for alugado ou vendido." }
      - label: "UF (estado) — Obrigatório"
        name: "uf"
        widget: "select"
        options: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
        default: "MS"
      - { label: "Cidade — Obrigatório", name: "cidade", widget: "string", default: "Campo Grande", hint: "Digite apenas o nome da cidade, sem o estado (o estado é selecionado no campo UF acima)." }
      - { label: "Bairro — Obrigatório", name: "bairro", widget: "string" }
      - { label: "Título do anúncio — Obrigatório", name: "titulo", widget: "string" }
      - label: "Finalidade — Obrigatório"
        name: "finalidade"
        widget: "select"
        options: ["Aluguel", "Venda", "Temporada", "Obras e serviços"]
        default: "Aluguel"
      - { label: "Unidade de preço (somente para Temporada)", name: "unidade_temporada", widget: "select", options: ["dia", "semana", "mês", "hóspede"], default: "dia", required: false, hint: "Usado apenas quando a finalidade for Temporada. Aluguel é sempre por mês e Venda é valor total." }
      - label: "Tipo de imóvel — Obrigatório"
        name: "tipo"
        widget: "select"
        options: ["Casa", "Apartamento", "Studio", "Terreno", "Sala/Galpão Comercial", "Chácara/Fazenda", "Outro"]
        default: "Casa"
      - { label: "Preço (R$)", name: "preco", widget: "number", value_type: "int", required: false, min: 1, hint: "Deixe em branco se não quiser informar. Não é permitido salvar com valor 0." }
      - { label: "Quartos", name: "quartos", widget: "number", value_type: "int", required: false }
      - { label: "Banheiros", name: "banheiros", widget: "number", value_type: "int", required: false }
      - { label: "Vagas de garagem", name: "vagas", widget: "number", value_type: "int", required: false }
      - { label: "Área (m²)", name: "area", widget: "number", value_type: "int", required: false }
      - { label: "Descrição — Obrigatório", name: "descricao", widget: "text" }
      - label: "Fotos"
        name: "fotos"
        widget: "list"
        required: false
        collapsed: false
        hint: "Toque em \"Adicionar Fotos\" para escolher as fotos do imóvel. Para apagar uma foto, toque no X vermelho ao lado dela."
        field: { label: "Foto", name: "src", widget: "image", choose_url: false }
        summary: "{{fields.src}}"
      - label: "Vídeos"
        name: "videos"
        widget: "list"
        required: false
        collapsed: false
        hint: "Vídeo do imóvel (opcional). Toque no X vermelho para apagar."
        field: { label: "Vídeo", name: "src", widget: "file", choose_url: false }
        summary: "{{fields.src}}"
      - { label: "Endereço completo (rua, número, bairro, cidade)", name: "endereco", widget: "string", required: false, hint: "Digite o endereço completo. O mapa é gerado automaticamente." }
      - { label: "WhatsApp (com DDI 55 + DDD, só números) — Obrigatório", name: "whatsapp", widget: "string" }
